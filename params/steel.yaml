    unit: "1"
    status: derived
    source: daehn_2017
    locator: "Fig. 1: construction 596 of 1,088 Mt"
  st.share.metal_goods:
    value: 0.1626
    unit: "1"
    status: derived
    source: daehn_2017
    locator: "Fig. 1: metal goods 177 of 1,088 Mt"

  st.lifetime.transport:
    value: 20
    unit: a
    status: sourced
    distribution: uniform
    low: 13
    high: 27
    source: pauliuk_2013_steel_stocks
    locator: "Table 4 basic set (also Pauliuk et al. 2013a Table 1, all regions except developed Asia); bounds = Table 4 'all lifetimes 33% shorter/longer'"
  st.lifetime.industrial_equipment:
    value: 30
    unit: a
    status: sourced
    distribution: uniform
    low: 20
    high: 40
    source: pauliuk_2013_steel_stocks
    locator: "Table 4 basic set (also Pauliuk et al. 2013a Table 1, all regions except developed Asia); bounds = Table 4 'all lifetimes 33% shorter/longer'"
  st.lifetime.construction:
    value: 75
    unit: a
    status: sourced
    distribution: uniform
    low: 50
    high: 100
    source: pauliuk_2013_steel_stocks
    locator: "Table 4 basic set; bounds = Table 4 'construction lifetime 33% shorter/longer' (50, 100 a). Daehn et al. 2017 p. 6601 uses the same 75 a"
  st.lifetime.metal_goods:
    value: 15
    unit: a
    status: sourced
    distribution: uniform
    low: 10
    high: 20
    source: pauliuk_2013_steel_stocks
    locator: "Table 4 basic set (also Pauliuk et al. 2013a Table 1, all regions except developed Asia); bounds = Table 4 'all lifetimes 33% shorter/longer'"
  st.lifetime_sigma_fraction:
    value: 0.3
    unit: "1"
    status: sourced
    source: pauliuk_2013_steel_stocks
    locator: "Section 2.3.3, p. 26: 'the lifetime followed a normal distribution and the standard deviation was set to 30% of the mean'"

  st.eol_recovery_rate:
    value: 0.80
    unit: "1"
    status: sourced
    distribution: uniform
    low: 0.70
    high: 0.90
    source: daehn_2017
    locator: "p. 6601: '80% (average end-of-life recovery rate)', citing worldsteel 2010 fact sheet"
    range_source: pauliuk_2013_steel_stocks
    note: "Share of end-of-life steel recovered as scrap; the rest stays in obsolete stocks or landfill. Low bound: Pauliuk et al. 2013b p. 29 (iii) assume ca. 30 % of steel leaving use is lost to landfill or obsolete stocks. High bound 0.90: UNEP/Daehn p. 6599 cites recovery 'as high as 90%'."
  st.product_yield:
    value: 0.7594
    unit: "1"
    status: derived
    source: daehn_2017
    locator: "Fig. 1: steel end-use products 1,088 Mt less cast iron 68 and cast steel 10 = 1,010 Mt; world crude steel 2008 1,330 Mt (USGS DS140)"
    note: "Final steel products per tonne of crude steel; converts the historical crude-steel series into product inflow."
  st.process_loss_allowance:
    value: 0.12
    unit: "1"
    status: sourced
    source: daehn_2017
    locator: "p. 6602, Section 2.2: 'an overall average of 12% was added to each product category to cover these losses'"
    note: "Iron sources charged per tonne of product = 1 + this. Copper leaving with these losses is assumed to be at the melt concentration."

