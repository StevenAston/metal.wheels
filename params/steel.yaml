  st.allocation_pinch:
    value: 0
    unit: "1"
    status: assumption
    note: "How copper is spread over products before tolerances bind. 0 = mixed: as evenly as tolerances allow, close to Daehn's 2008 Sankey where EAF steel goes to products pro rata (EAF share of construction 38 %, vehicles 16 %; SI Table S24). 1 = pinch: most tolerant products first (Daehn's perfect-allocation analysis), which concentrates copper in long-lived construction steel. Primary iron and unusable scrap are the same either way; only where copper sits, and so what returns decades later, differs."
  st.cu_to_process_losses:
    value: 0.0
    unit: "1"
    status: assumption
    distribution: uniform
    low: 0.0
    high: 1.0
    note: "Share of the copper concentration carried by the process-loss allowance (slag, dust, unrecovered yield losses). 0 = copper stays with the steel, since it is more noble than iron and does not oxidise into slag; tolerance then applies to product mass, as in Daehn Fig. 2 (1.8 Mt tolerable in 2008). 1 = losses carry copper at melt concentration, as in Daehn Fig. 3."

