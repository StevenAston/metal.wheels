    value: 0.1929
    unit: "1"
    status: derived
    source: daehn_2017
    locator: "SI Table S45, Pauliuk row: vehicles 200 of 1,037 Mt"
    note: "Pauliuk et al. 2013a 2008 final demand by sector (1,037 Mt) as tabulated by Daehn. Cullen et al. 2012 gives 139/176/596/177 of 1,088 Mt; Pauliuk's split is used because lifetimes and saturation levels are his. Held constant over 1900-2025 (assumption); Daehn combines Pauliuk's sector demand with Cullen's product matrix in the same way (SI 2.2.1.1)."
