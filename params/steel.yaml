# Steel module (Phase 2): sector stock model, scrap copper and tolerances.
# Sectors follow Daehn et al. (2017) / Pauliuk et al. (2013): transport, industrial equipment,
# construction, metal goods. Concentrations are mass fractions (0.003 = 0.3 wt% Cu).
#
# PENDING entries (status: assumption, note starts "PENDING") are placeholders until the
# Daehn 2017 Supporting Information arrives (see PLAN change log).
domain: steel
parameters:
  st.share.transport:
    value: 0.1278
    unit: "1"
    status: derived
    source: daehn_2017
    locator: "Fig. 1 (2008 end-use products, after Cullen et al. 2012): vehicles 139 of 1,088 Mt"
    note: "Share of final steel by end-use sector, held constant over time (assumption). Includes castings."
  st.share.industrial_equipment:
    value: 0.1618
    unit: "1"
    status: derived
    source: daehn_2017
    locator: "Fig. 1: industrial equipment 176 of 1,088 Mt"
  st.share.construction:
