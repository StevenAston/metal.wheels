  # Band shares by sector: share of each sector's steel in each tolerance band (missing = 0).
  # Read from Daehn et al. 2017 Fig. 1, right-hand 'Set copper tolerances' column: the height in
  # pixels of each legend colour within each end-use group (embedded 2100 px figure image),
  # cast iron and cast steel excluded. About 4-5 Mt per pixel, so flows under ~5 Mt are missed.
  # Check: applying these to the 2008 sector split reproduces the Fig. 3 band totals within ~15 %.
  st.band_share.transport.t0060:
    value: 0.519
    unit: "1"
    status: derived
