# Future demand driver (Task 1.4): per-capita in-use stock follows a logistic path towards a
# saturation level, times UN WPP 2024 population (medium variant to 2100, held flat after).
domain: demand
parameters:
  dem.saturation_stock_per_capita:
    value: 220
    unit: kg/person
    status: derived
    distribution: uniform
    low: 140
    high: 300
    source: unep_2010_metal_stocks
    locator: "Table 1, pp. 16-17: copper in-use stock per capita, more-developed countries 140-300 kg (determinations mostly 2000-2006)"
    note: "Central value = midpoint of the more-developed-country range; treats today's rich-country stock as the global saturation level (assumption about the future). Same table: global 35-55 kg, less-developed 30-40 kg. Replaces the earlier unsourced 215-300 kg range."
  dem.growth_calibration_years:
    value: 30
    unit: a
    status: assumption
    low: 10
    high: 50
    note: "Window (years ending 2025) over which the logistic growth rate of per-capita stock is fitted to the historical model run."
  dem.population_hold_year:
    value: 2100
    unit: a
    status: assumption
    note: "Calendar year after which population is held flat (PLAN resolved decision 4). Unit 'a' here denotes a calendar year."
