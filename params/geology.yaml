# Grade-tonnage distribution, endowment by depth, and ore/tailings material properties.
domain: geology
parameters:
  # --- Lognormal grade-tonnage (Gerst 2008) ---
  # Gerst's convention: parameters of ln(grade in wt%), tonnage-weighted. The model converts to
  # mass fractions internally. Median grade = exp(mu_w) = 0.516 %.
  geo.grade.gerst.mu_w:
    value: -0.6616
    unit: "1"
    status: sourced
    source: gerst_2008
    locator: "Table 3, p. 620, 'Global porphyry'"
    note: "Location parameter of ln(grade, wt%). Gerst reports median 0.52 %, mean 0.56 %. Porphyry deposits only; sediment-hosted (mu_w 0.4269) and VMS (-0.3949) differ and may make the true global distribution bimodal."
  geo.grade.gerst.sigma2_w:
    value: 0.1567
    unit: "1"
    status: sourced
    source: gerst_2008
    locator: "Table 3, p. 620, 'Global porphyry'"
    note: "Variance of ln(grade, wt%)."
  geo.grade.kesler_ext.mu_w:
    value: -0.7467
    unit: "1"
    status: sourced
    source: gerst_2008
    locator: "p. 623, text following eqs 16-17 (extrapolation to Kesler & Wilkinson endowment)"
    note: "Grade distribution extrapolated to the larger Kesler & Wilkinson 2008 resource."
  geo.grade.kesler_ext.sigma2_w:
    value: 0.1892
    unit: "1"
    status: sourced
    source: gerst_2008
    locator: "p. 623, text following eqs 16-17 (extrapolation to Kesler & Wilkinson endowment)"

  # --- Endowment bracket A: Harmsen 2013 Table 1 (land-based, all deposit types, first 5 km) ---
  geo.endow.harmsen.layer_0_1km: {value: 3350, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Originally in ground'", note: "Up to 1 km"}
  geo.endow.harmsen.layer_1_2km: {value: 4790, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Originally in ground'", note: "1-2 km"}
  geo.endow.harmsen.layer_2_3km: {value: 5740, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Originally in ground'", note: "2-3 km"}
  geo.endow.harmsen.layer_3_4km: {value: 5740, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Originally in ground'", note: "3-4 km"}
  geo.endow.harmsen.layer_4_5km: {value: 5270, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Originally in ground'", note: "4-5 km. Layers sum to the table total of 2.49E+04 Mt."}
  geo.endow.harmsen.analysed_0_1km: {value: 1080, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Analysed'", note: "Discovered deposits with known grade and tonnage; includes copper already produced."}
  geo.endow.harmsen.analysed_1_2km: {value: 514, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Analysed'"}
  geo.endow.harmsen.analysed_2_3km: {value: 247, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Analysed'"}
  geo.endow.harmsen.analysed_3_4km: {value: 173, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Analysed'"}
  geo.endow.harmsen.analysed_4_5km: {value: 90.4, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Analysed'", note: "Table total 2.10E+03 Mt."}
  geo.discovered_top500_share_first_km:
    value: 0.85
    unit: "1"
    status: sourced
    source: harmsen_2013
    locator: "§2.1.2, p. 64 ('85 % of the reported depth to top ore is within 500 m', from Long 2011)"
    note: "Used as the share of discovered copper in the first km that lies above 500 m (interpretation: an assumption that depth-to-top-of-ore tracks where the copper is)."
  geo.calib.produced_share_top500_2010:
    value: 0.771
    unit: "1"
    status: derived
    source: harmsen_2013
    locator: "§2.1.2 and Table 1, p. 64"
    note: "Calibration target for the depth-order multiplier: 85 % of first-km production (526 Mt) from the top 500 m, as a share of total production to ~2010 (580 Mt): 0.85 x 526 / 580."
  geo.endow.harmsen.produced_0_1km: {value: 526, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Produced'", note: "Cumulative production to about 2010 from the first km."}
  geo.endow.harmsen.produced_1_2km: {value: 54.1, unit: Mt, status: sourced, source: harmsen_2013, locator: "Table 1, p. 64, 'Produced'"}
  geo.endow.harmsen.produced_share_top_500m:
    value: 0.85
    unit: "1"
    status: sourced
    source: harmsen_2013
    locator: "§2.1.2, p. 64 (from Long 2011)"
    note: "Share of first-km production assumed to come from the top 500 m."

  # --- Endowment bracket B: Kesler & Wilkinson 2008 ---
  geo.endow.kesler.above_3_3km:
    value: 89000
    unit: Mt
    status: sourced
    source: kesler_wilkinson_2008
    locator: "p. 257 ('recoverable resource of ~8.9 x 10^10 t of copper')"
    note: "All deposit types above 3.3 km, taken as the likely limit of mining. Enough for ~5,500 years of 2008 mine production."
  geo.endow.kesler.depth_limit:
    value: 3300
    unit: m
    status: sourced
    source: kesler_wilkinson_2008
    locator: "p. 257 ('assuming ~3.3 km as the likely limit of mining')"
    note: "Kesler bracket uses Harmsen's depth profile, truncated here and scaled to 89 Bt (assumption: Kesler & Wilkinson give no depth distribution)."
  geo.endow.kesler.porphyry_all_depths:
    value: 170000
    unit: Mt
    status: sourced
    source: kesler_wilkinson_2008
    locator: "Abstract, p. 255 (~1.7 x 10^11 t)"
  geo.endow.kesler.all_types_all_depths:
    value: 300000
    unit: Mt
    status: sourced
    source: kesler_wilkinson_2008
    locator: "Abstract, p. 255 (~3 x 10^11 t)"

  # --- USGS 2013 global assessment ---
  geo.usgs.identified:
    value: 2100
    unit: Mt
    status: sourced
    source: usgs_fs_2014_3004
    locator: "p. 1, summary"
    note: "Identified resources at the 2013 assessment. MCS 2026 (citing the 2015 assessment, Hammarstrom et al. 2019) states the 2.1 Bt INCLUDES ~600 Mt of past production, i.e. ~1.5 Bt unextracted; see geo.usgs.identified_unextracted."
  geo.usgs.identified_unextracted:
    value: 1500
    unit: Mt
    status: sourced
    source: usgs_mcs_2026
    locator: "Copper chapter, 'World Resources' paragraph"
    note: "Identified resources excluding ~600 Mt past production (2015 assessment, Hammarstrom et al. 2019)."
  geo.usgs.undiscovered_mean:
    value: 3500
    unit: Mt
    status: sourced
    source: usgs_fs_2014_3004
    locator: "p. 1, summary and Table 1 (total copper)"
    note: "Mean undiscovered: porphyry within 1 km, sediment-hosted stratabound within 2.5 km of surface."

  # --- Material properties ---
  geo.tailings_dry_density:
    value: 1.40
    unit: t/m3
    status: sourced
    distribution: uniform
    low: 1.30
    high: 1.48
    source: morales_2021
    locator: "Table 1, 'Natural dry density' (sand cone): dam zone 1.39-1.48, pond zone 1.30-1.44 t/m3"
    note: "In-situ dry density of a decades-old conventional (slurry) copper TSF in Chile; value is the midpoint of the combined in-situ range. Laboratory limits from the same table: standard-Proctor maximum 1.94 (dam) / 1.80 (pond), minimum 1.30; specific gravity 2.72-2.79. Proctor maxima are an upper bound for compacted or filtered (dry-stack) storage, not conventional ponds. Single-site evidence."

  # --- Mass outputs (Task 1.7) ---
  geo.strip_ratio:
    value: 1.5
    unit: "1"
    status: derived
    distribution: uniform
    low: 1.0
    high: 2.0
    source: nassar_2022
    locator: "Results: copper's attributable ore mined + waste rock removed = 9.4 Bt (2018)"
    range_source: nassar_2022
    note: "Waste rock per tonne ore = (9.4 Bt - model 2018 ore 3.8 Bt) / 3.8 Bt = 1.47. Revenue-allocated (Cu-Au and Cu-Mo mines share burdens), so a physical lower bound. High = the conventional strip ratio of 2 used in total-material-requirement studies and as Nassar's surface-mine default."
  geo.concentrate_grade:
    value: 0.285
    unit: "1"
    status: sourced
    distribution: uniform
    low: 0.27
    high: 0.30
    source: harmsen_2013
    locator: "§2.1.3, p. 65 ('a copper concentrate with a grade between 27 % and 30 %')"
    note: "Mass fraction of Cu in flotation concentrate; tailings mass = ore - concentrate."
  geo.discovery_smoothing_years:
    value: 10
    unit: a
    status: assumption
    low: 1
    high: 30
    note: "Paced discovery keeps discovered-unmined copper >= lead x the trailing mean of annual extraction over this many years (exploration responds to demand trends, not single years). Introduced to remove a discovery pulse when population is held flat after 2100."
  geo.max_discovery_rate:
    value: 0.01
    unit: "1"
    status: assumption
    distribution: uniform
    low: 0.005
    high: 0.03
    note: "Diminishing discovery (Steve, 2026-10-15): annual discovery capped at this share of the copper still undiscovered (exploration 'creaming'). At 0.01 the cap binds only once roughly 70 % of the Harmsen endowment has been discovered. Unsourced assumption."
