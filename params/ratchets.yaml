ratchets:
  - id: cu_in_steel
    name: "Copper in steel scrap (hot shortness)"
    mechanism: tramp_contamination
    host: steel
    agent: Cu
    route: fe
    removal: "No industrial removal from the melt; dilution with primary iron or cleaner scrap is the only commercial remedy (Daehn 2017, citing Björkman)."
    tolerance: {param: st.tolerance.t0100, range_params: [st.tolerance.t0060, st.tolerance.t0400]}
    tolerance_note: "0.1 wt % causes hot shortness; product tolerances run from 0.06 wt % (drawing steels) to 0.4 wt % (rebar)."
    energy_step: {formula: "a - b", params: {a: st.energy.bf_bof, b: st.energy.scrap_eaf}, basis: "kg of iron charge switched from scrap to primary"}
    modelled_in: [metalwheels.steel.dilution, metalwheels.steel.stockflow]
    source: daehn_2017
    locator: "p. 6599 (Introduction)"
    wheel_check: [{route: fe, element: Cu, expect: [dissolved_harmful]}]
    interactions:
      - {with: sn_in_steel, kind: amplifies, note: "Tin exacerbates hot shortness (Daehn 2017), so the two tolerances are not independent."}
      - {with: cu_to_other_scrap, kind: fed_by, note: "Copper collected but not separated travels in steel scrap (Phase 2 link)."}

  - id: sn_in_steel
    name: "Tin in steel scrap (hot shortness)"
    mechanism: tramp_contamination
    host: steel
    agent: Sn
    route: fe
    removal: "Not removed in the EAF; tinplate can be isolated and detinned before melting."
    tolerance: {param: rt.steel.sn_tolerance}
    energy_step: {formula: "a - b", params: {a: st.energy.bf_bof, b: st.energy.scrap_eaf}, basis: "kg of iron charge switched from scrap to primary"}
    modelled_in: []
    source: daehn_2017
    locator: "p. 6599 (Introduction)"
    secondary_sources: ["unep_2013_metal_recycling p. 151: tin dissolves in molten steel and solidifies on grain boundaries"]
    wheel_check: [{route: fe, element: Sn, expect: [dissolved_harmful]}]
    interactions:
      - {with: cu_in_steel, kind: amplifies, note: "Synergistic hot shortness."}

  - id: alloys_into_carbon_steel
    name: "Alloying metals lost into carbon steel (non-functional recycling)"
    mechanism: dissipation
    host: nickel, molybdenum, cobalt, tungsten
    agent: Ni
    route: fe
    removal: "Stable in molten iron; stays in the steel, lost for other uses."
    tolerance: null
    tolerance_note: "Not a host tolerance: benign to carbon steel, lost to the alloying metal's own cycle."
    energy_step: {formula: "a", params: {a: rt.ced.ni}, basis: "kg of Ni replaced from primary"}
    modelled_in: []
    source: unep_2013_metal_recycling
    locator: "p. 151: alloying elements such as nickel, tungsten, molybdenum and cobalt are stable in molten iron, stay in metallic iron and are lost for other uses"
    secondary_sources: ["unep_2011_recycling_rates Table C1, p. 30: EOL-RR Ni 57-63 %, Mo 30 %"]
    wheel_check:
      - {route: fe, element: Ni, expect: [dissolved_benign]}
      - {route: fe, element: Mo, expect: [dissolved_benign]}
    interactions:
      - {with: cu_in_steel, kind: parallel, note: "Same thermodynamics (more noble than iron), opposite sign: copper harms the host, nickel is harmless to it but lost."}

  - id: fe_in_aluminium
    name: "Iron in aluminium scrap"
    mechanism: tramp_contamination
    host: aluminium (wrought)
    agent: Fe
    route: al
    removal: "Practically impossible to remove; of the alloying elements only Mg and Zn can be removed (Nakajima et al., as cited by Cullen and Allwood 2013)."
    tolerance: {param: rt.al.fe_tolerance}
    energy_step: {formula: "a - b", params: {a: rt.al.energy_primary, b: rt.al.energy_recycling}, basis: "kg of aluminium supplied from primary instead of scrap"}
    modelled_in: []
    source: aa_2018_teal_sheets
    locator: "PDF pp. 18, 20 (composition limits)"
    secondary_sources: ["cullen_allwood_2013_al accepted manuscript p. 12 (irreversibility)"]
    wheel_check: [{route: al, element: Fe, expect: [dissolved_benign, dissolved_harmful, dissolved_unrated]}]
    interactions:
      - {with: al_dilution, kind: feeds, note: "Iron above the wrought limit is diluted with primary aluminium."}

  - id: si_in_aluminium
    name: "Silicon and alloy mix: wrought-to-cast down-cycling"
    mechanism: route_switch
    host: aluminium (wrought)
    agent: Si
    route: al
    removal: "Not removable; wrought scrap can go into casting alloys but not the reverse."
    tolerance: {param: rt.al.si_tolerance}
    energy_step: {formula: "a - b", params: {a: rt.al.energy_primary, b: rt.al.energy_recycling}, basis: "kg of wrought demand met from primary once cast demand no longer absorbs the scrap"}
    modelled_in: []
    source: cullen_allwood_2013_al
    locator: "accepted manuscript pp. 12-13: 6.1 Mt wrought scrap down-cycled into cast products; non-recyclable casting scrap surplus projected (Modaresi and Müller; Hatayama et al.)"
    wheel_check: [{route: al, element: Si, expect: [dissolved_benign, dissolved_harmful, dissolved_unrated]}]
    interactions:
      - {with: al_dilution, kind: feeds, note: "The cast-alloy sink hides the problem only while cast demand grows."}

  - id: al_dilution
    name: "Primary aluminium used to dilute ('sweeten') scrap"
    mechanism: route_switch
    host: aluminium
    agent: alloy mix
    route: al
    removal: "Dilution is the remedy, and is irreversible."
    tolerance: null
    tolerance_note: "Set by the target alloy (see fe_in_aluminium, si_in_aluminium)."
    energy_step: {formula: "a - b", params: {a: rt.al.energy_primary, b: rt.al.energy_recycling}, basis: "kg of sweetener"}
    modelled_in: []
    source: cullen_allwood_2013_al
    locator: "accepted manuscript pp. 11-12 and Table 2: 8.0 Mt/yr sweetener; 5 % sweetener nearly doubles, 25 % raises five-fold the embodied energy of recycled aluminium"
    wheel_check: []
    interactions:
      - {with: cu_in_steel, kind: parallel, note: "Aluminium's analogue of the copper-in-steel dilution."}

  - id: zn_to_eaf_dust
    name: "Zinc from galvanised steel to EAF dust"
    mechanism: dissipation
    host: zinc
    agent: Zn
    route: fe
    removal: "Volatilised to dust; recoverable via the Waelz kiln where the dust is processed."
    tolerance: null
    tolerance_note: "Zn leaves the steel melt; the ratchet is on the zinc cycle."
    energy_step: {formula: "a", params: {a: rt.ced.zn}, basis: "kg of Zn not recovered from dust, replaced from primary"}
    modelled_in: []
    source: unep_2013_metal_recycling
    locator: "p. 75 (15-20 kg dust per t steel; 5.2-7 Mt/yr) and Table 26, p. 191 (18-35 % Zn)"
    secondary_sources: ["unep_2011_recycling_rates Table D1, p. 31: Zn EOL-RR 19-60 %"]
    wheel_check: [{route: fe, element: Zn, expect: [volatilised]}]
    interactions:
      - {with: cu_in_steel, kind: parallel, note: "Same scrap stream; zinc leaves the melt, copper stays."}

  - id: glass_colour_mixing
    name: "Glass colour mixing (green cullet in flint)"
    mechanism: tramp_contamination
    host: container glass (flint)
    agent: green cullet (Cr2O3, Fe2O3 colourants)
    route: null
    removal: "Colourants cannot be removed in the furnace at reasonable cost; mixed cullet goes to amber or green glass."
    tolerance: {param: rt.glass.green_in_flint, range_params: [rt.glass.green_in_flint, rt.glass.green_in_amber]}
    tolerance_note: "0.5 % green in flint; amber accepts up to 30 % green."
    energy_step: {formula: "a * b", params: {a: rt.glass.melt_energy, b: rt.glass.cullet_energy_saving}, basis: "kg of cullet that cannot be used, replaced by batch"}
    modelled_in: []
    source: wrap_2004_glass_colour
    locator: "Executive summary (PDF pp. 2-3)"
    secondary_sources: ["scalet_2013_glass_bref pp. 121, 314 (melting energy, cullet saving)"]
    wheel_check: []
    interactions: []

  - id: polymer_blending
    name: "Immiscible polymer blending (non-polyolefins in HDPE)"
    mechanism: tramp_contamination
    host: HDPE
    agent: PET, PA-6, PS
    route: null
    removal: "Not separable after melt blending; compatibilisers only partly restore properties."
    tolerance: {param: rt.polymer.npo_in_hdpe}
    energy_step: null
    energy_note: "No sourced virgin-vs-recycled polymer energy in the registry yet."
    modelled_in: []
    source: demets_2022
    locator: "Section 5 (Conclusions)"
    wheel_check: []
    interactions: []

  - id: pt_dissipation
    name: "Platinum dissipated in electronics"
    mechanism: dissipation
    host: platinum-group metals
    agent: Pt
    route: cu
    removal: "Recovered in copper/precious-metal smelters when the product reaches them; mostly it does not."
    tolerance: null
    tolerance_note: "Recycling rate 0-5 % in electronics against 50-55 % in vehicles and 80-90 % in industrial uses."
    energy_step: {formula: "a", params: {a: rt.ced.pt}, basis: "kg of Pt replaced from primary"}
    modelled_in: []
    source: unep_2011_recycling_rates
    locator: "Table E1, p. 32"
    wheel_check: [{route: cu, element: Pt, expect: [recovered]}]
    interactions: []

  - id: in_dissipation
    name: "Indium dissipated in electronics"
    mechanism: dissipation
    host: indium
    agent: In
    route: pbzn
    removal: "Recoverable in Zn/Pb (and Cu) infrastructure in principle; old scrap rarely reaches it."
    tolerance: null
    energy_step: {formula: "a", params: {a: rt.ced.in}, basis: "kg of In replaced from primary"}
    modelled_in: []
    source: unep_2011_recycling_rates
    locator: "Table F1, p. 36"
    wheel_check: [{route: pbzn, element: In, expect: [recovered]}]
    interactions: []

  - id: ree_dissipation
    name: "Rare earths lost to slag and landfill"
    mechanism: dissipation
    host: rare earth elements
    agent: REE
    route: fe
    removal: "Oxides more stable than iron or copper oxides; report to slag in base-metal routes."
    tolerance: null
    energy_step: {formula: "a", params: {a: rt.ced.nd}, basis: "kg of Nd replaced from primary"}
    modelled_in: []
    source: unep_2011_recycling_rates
    locator: "Table F1, pp. 36-37"
    wheel_check:
      - {route: fe, element: REE, expect: [lost_to_slag]}
      - {route: cu, element: REE, expect: [lost_to_slag]}
    interactions: []

  - id: cu_to_other_scrap
    name: "Copper collected but not separated (into steel and other scrap)"
    mechanism: dissipation
    host: copper
    agent: Cu
    route: fe
    removal: "Once shredded into steel scrap, copper stays in the steel."
    tolerance: null
    energy_step: {formula: "a", params: {a: rt.ced.cu}, basis: "kg of Cu replaced from primary"}
    modelled_in: [metalwheels.copper.fates, metalwheels.steel.link]
    source: helbig_2020
    locator: "Fig. S11 (other scrap markets, WMR.2)"
    wheel_check: [{route: fe, element: Cu, expect: [dissolved_harmful]}]
    interactions:
      - {with: cu_in_steel, kind: feeds, note: "This flow is the copper load of steel scrap."}
      - {with: cu_ore_grade, kind: feeds, note: "Copper lost to steel is replaced from leaner ore."}

  - id: cu_in_use_dissipation
    name: "Copper dissipated in use (corrosion, wear, fungicides)"
    mechanism: dissipation
    host: copper
    agent: Cu
    route: null
    removal: "None."
    tolerance: null
    energy_step: {formula: "a", params: {a: rt.ced.cu}, basis: "kg of Cu replaced from primary"}
    modelled_in: [metalwheels.copper.stockflow]
    source: helbig_2020
    locator: "Fig. S11 (dissipation, ENV.0); registry cu.in_use_dissipation_fraction"
    wheel_check: []
    interactions:
      - {with: cu_ore_grade, kind: feeds, note: "Replaced from primary."}

  - id: cu_ore_grade
    name: "Declining copper ore grade"
    mechanism: grade
    host: copper
    agent: ore grade
    route: null
    removal: "Irreversible at human time scales: richest deposits are mined first."
    tolerance: null
    energy_step: null
    energy_note: "Modelled: E(g, D) = a + b/g + k_D (D - D0) (Phase 1, Norgate/Koppelaar options)."
    modelled_in: [metalwheels.copper.geology, metalwheels.copper.energy]
    source: harmsen_2013
    locator: "grade-energy relation and endowment bracket (Phase 1 registry)"
    wheel_check: []
    interactions:
      - {with: cu_depth, kind: amplifies, note: "Leaner ore is also deeper ore in the extraction ordering."}

  - id: cu_depth
    name: "Increasing copper mining depth"
    mechanism: depth
    host: copper
    agent: depth
    route: null
    removal: "Irreversible."
    tolerance: null
    energy_step: {formula: "a", params: {a: en.depth.energy_per_m}, basis: "kg Cu per additional metre of depth (MJ/kg/m)"}
    modelled_in: [metalwheels.copper.geology, metalwheels.copper.energy]
    source: harmsen_2013
    locator: "registry en.depth.energy_per_m"
    wheel_check: []
    interactions:
      - {with: cu_ore_grade, kind: amplifies, note: "See cu_ore_grade."}
