    note: "Maximum Fe in common wrought alloys (can stock, extrusion, structural)."
  rt.al.si_tolerance:
    value: 0.002
    unit: "1"
    status: sourced
    low: 0.002
    high: 0.006
    source: aa_2018_teal_sheets
    locator: "PDF pp. 18, 20: Si max 0.20 wt % for 5182; 0.20-0.6 wt % for 6063 (high = upper limit)"
  rt.al.energy_primary:
    value: 170.0
    unit: MJ/kg
    status: sourced
    source: cullen_allwood_2013_al
    locator: "Table 2 (accepted manuscript p. 12): electrolysis (pure Al) 170 GJ/t"
  rt.al.energy_recycling:
    value: 10.0
    unit: MJ/kg
    status: sourced
    source: cullen_allwood_2013_al
    locator: "Table 2 (accepted manuscript p. 12): recycling (scrap melting) 10 GJ/t, from IAI"
  rt.al.dilution_flow:
    value: 8.0
    unit: Mt
    status: sourced
    source: cullen_allwood_2013_al
    locator: "accepted manuscript p. 11: 8.0 Mt per year of pure aluminium used to dilute ('sweeten') alloy mixes in remelting and refining"
  rt.al.downcycled_wrought_scrap:
    value: 6.1
