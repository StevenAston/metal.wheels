    status: sourced
    source: cullen_allwood_2013_al
    locator: "accepted manuscript p. 13: an estimated 6.1 Mt of wrought scrap diverted into cast products"
  # --- EAF dust -----------------------------------------------------------------------------
  rt.eaf.dust_per_t_steel:
    value: 17.5
