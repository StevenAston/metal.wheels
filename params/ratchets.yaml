# Ratchet catalogue (Task 4.1).
#
# `parameters` holds the numbers (validated by the registry like every other parameter file).
# `ratchets` is the catalogue itself, validated by `metalwheels.ratchets.catalogue`; entries point
# at parameter keys here or in other files, never at bare numbers.
#
# A ratchet is a mechanism that, once a unit of material has passed through it, cannot be undone
# at reasonable cost, so that the next cycle starts from a worse position. Mechanism types
# (PLAN.md Task 4.1):
#   tramp_contamination - an element or material enters a host melt or mix and cannot be removed
#   dissipation         - the substance leaves the useful cycle in a form or place that is not
#                         recovered (in use, into another metal's scrap, residues, landfill)
#   grade               - the next primary unit comes from leaner ore
#   depth               - the next primary unit comes from deeper ore
#   route_switch        - contamination or quality loss forces a secondary flow out of its route
#                         and primary material in to replace it (dilution, down-cycling)
#
# Energy steps: MJ per kg of the stated basis, evaluated by the catalogue module with interval
# arithmetic on each parameter's [low, high] range.
domain: ratchets
parameters:
  # --- steel: tin -------------------------------------------------------------------------
  rt.steel.sn_tolerance:
    value: 0.0004
    unit: "1"
    status: sourced
    source: daehn_2017
    locator: "p. 6599: tin exacerbates hot shortness even at concentrations as low as 0.04 wt %"
  rt.steel.tinplate_share_of_scrap:
    value: 0.01
