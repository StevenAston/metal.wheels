[project]
name = "metalwheels"
version = "0.1.0"
description = "Long-horizon metal stock-flow and maintenance-energy model: copper core, steel coupling, input-output cascade, ratchet catalogue."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "matplotlib>=3.8",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
metalwheels = "metalwheels.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metalwheels"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Model code mirrors the equations in its docstrings (E, M, W, T, ...).
"src/metalwheels/{copper,steel,cascade,ratchets}/*.py" = ["N806"]
# Report text and tables: long prose lines are clearer unwrapped.
"src/metalwheels/report.py" = ["E501", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
